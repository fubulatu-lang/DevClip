name: APK

# Builds an installable APK.
#
# This existed before the conversion so that dropping Expo never left the
# project unable to reach the phone — EAS cannot build a plain Android app.
# The conversion has happened, and all it cost this file was the Node setup
# and the prebuild step.
#
# Every push to main refreshes a single release tagged `latest`, so there is
# one permanent URL to download the current build from — which matters when
# the only device in the loop is the phone the app is for.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for a pinned release (e.g. v1.1.0). Leave empty to refresh `latest`.'
        required: false
        type: string

# One build per ref. A second push supersedes the first rather than racing it
# to the same release asset.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # packages: '' — the action installs the obsolete `tools` package by
      # default and sdkmanager exits 1 on it. See ci.yml.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4

      # Android refuses to update an installed app whose signature does not
      # match, so the key this is signed with decides whether a new build
      # installs over the old one or demands an uninstall first — and an
      # uninstall takes the clip history with it.
      #
      # The keystore EAS has been signing with can be downloaded from
      # expo.dev and stored here as a secret; then these builds and the
      # existing install agree and updates are ordinary. Without it, Gradle
      # generates a throwaway debug key per run, every build disagrees with
      # the last, and each install is an uninstall-and-lose-your-clips.
      - name: Decode the signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret. Building with a throwaway debug key — this APK will not install over an existing DevClip. Export a backup before installing it."
          else
            echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/devclip.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            # Injected signing rather than editing build.gradle: the file is
            # regenerated by every prebuild, so an edit to it would not last.
            ./gradlew :app:assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="${RUNNER_TEMP}/devclip.keystore" \
              -Pandroid.injected.signing.store.password="${STORE_PASSWORD}" \
              -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
              -Pandroid.injected.signing.key.password="${KEY_PASSWORD}"
          else
            ./gradlew :app:assembleRelease --no-daemon
          fi

      - name: Find it
        id: apk
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error::No APK was produced"; exit 1; }
          # An APK is a zip. A truncated or wrong-shaped file is not.
          unzip -l "$APK" | grep -q AndroidManifest.xml
          cp "$APK" "DevClip.apk"
          {
            echo "path=DevClip.apk"
            echo "size=$(du -h DevClip.apk | cut -f1)"
            echo "sha=$(sha256sum DevClip.apk | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'latest' }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          {
            echo "Built from \`${GITHUB_SHA}\` on $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Size | ${{ steps.apk.outputs.size }} |"
            echo "| SHA-256 | \`${{ steps.apk.outputs.sha }}\` |"
            echo
            if [ "${SIGNED}" = "true" ]; then
              echo "Signed with the project keystore, so it installs over an existing DevClip and keeps your clips."
            else
              echo "> **Signed with a throwaway debug key.** It will not install over an existing DevClip — Android rejects a signature change. Export a backup first, uninstall, then install this."
            fi
          } > notes.md

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${{ steps.apk.outputs.path }}" --clobber
            gh release edit "${TAG}" --notes-file notes.md
          else
            gh release create "${TAG}" "${{ steps.apk.outputs.path }}" \
              --title "DevClip ${TAG}" --notes-file notes.md \
              $([ "${TAG}" = "latest" ] && echo --prerelease)
          fi

          echo "### [Download the APK](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG})" >> "$GITHUB_STEP_SUMMARY"
