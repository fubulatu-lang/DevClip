name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch supersedes the first: cancel the older run
# rather than paying for a result nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # packages: '' or the action installs the obsolete `tools` SDK package
      # by default and sdkmanager exits 1 on it. The runner image already
      # carries the SDK and its accepted licences.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4

      # No prebuild any more. The Android project is the repository now, not
      # something generated from an app.json by a plugin on every build.
      #
      # compileReleaseKotlin rather than a full assemble: compiling is what
      # catches the class of error this job exists for, it needs no signing
      # key, and it costs a fraction of the time. It depends on resource
      # processing, so a string referenced from Kotlin but never declared
      # fails here too.
      - name: Compile
        run: ./gradlew :app:compileReleaseKotlin --no-daemon

  one-ui:
    name: One UI conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # Pointed at the Kotlin and the resources, which is where the interface
      # lives now. It used to scan src/, and src/ was the React Native app —
      # so after the conversion it would have passed by finding nothing to
      # look at, which is worse than failing.
      #
      # Advisory. The scanner covers the mechanically checkable subset —
      # hard-coded colours, off-scale spacing, missing reduced-motion guards.
      # Structure, copy and icon metaphors need a human read.
      - name: Scan for One UI violations
        run: python3 .claude/one-ui/scripts/oneui_scan.py app/src/main
        continue-on-error: true
