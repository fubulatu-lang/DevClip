# Compose and Kotlin both want headroom; the default 512m heap fails the build
# on a cold CI runner rather than merely being slow.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
# Each module gets only its own R class. Smaller, and it makes an accidental
# dependency on another module's resources a compile error rather than a
# surprise at runtime.
android.nonTransitiveRClass=true

kotlin.code.style=official
